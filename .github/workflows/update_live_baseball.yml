name: Update Live Baseball Data

on:
  schedule:
    # Runs at 10:00 AM UTC (6:00 AM EST) every Monday morning
    - cron: "0 10 * * 1"
  workflow_dispatch: # Allows you to manually click "Run workflow" from the Actions tab

jobs:
  update-live-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Baseball Data Script
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/live/fetch_live_baseball.py --sport MLB --year 2026 --league_id 114502 --reg_season_count 19

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live/
          git commit -m "Automated Monday Live Data Update" || echo "No changes to commit"
          git push
